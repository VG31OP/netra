[workspace]
resolver = "2"
members = [
    "crates/netra-common",
    "crates/netra-config",
    "crates/netra-storage",
    "crates/netra-parser",
    "crates/netra-protocols",
    "crates/netra-filter",
    "crates/netra-capture",
    "crates/netra-scanner",
    "crates/netra-discovery",
    "crates/netra-intelligence",
    "crates/netra-export",
    "crates/netra-core",
    "apps/cli",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NETRA Contributors"]
license = "Apache-2.0"
repository = "https://github.com/netra-project/netra"
rust-version = "1.80.0"

[workspace.dependencies]
# Error handling and logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
csv = "1.3"

# Concurrency and async
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
rayon = "1.10"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Network and parsing
etherparse = "0.16"
pcap-file = "2.0"

# CLI and UI
clap = { version = "4.5", features = ["derive", "env"] }

# Time and utilities
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
directories = "5.0"
